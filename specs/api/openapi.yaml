openapi: 3.1.0
info:
  title: ABC Electronic Invoicing — API
  version: 0.1.0-spec
  summary: Contracts of the MVC monolith (Spec-First phase).
  description: |
    REST contracts exposed by the **MVC controllers** of the monolith.
    Each operation calls a **use case** (input port) of the domain core, so the contract
    does not change when migrating to Hexagonal / microservices (see docs/03-architecture.md).

    Conventions:
    - Amounts as decimal strings (see specs/schemas/common.schema.json).
    - Errors as `application/problem+json` (RFC 9457).
    - Issuing operations require an `Idempotency-Key` header so that a client retry never
      consumes two sequence numbers (SPEC-005).
servers:
  - url: https://api.abc-software.pe/api/v1
    description: Monolith (production)
  - url: https://qa.abc-software.pe/api/v1
    description: Testing (OSE / SUNAT beta)
security:
  - bearerAuth: []
tags:
  - name: Invoices
    description: SPEC-001 Invoice and sales receipt
  - name: Notes
    description: SPEC-002 Credit and debit notes
  - name: Taxes
    description: SPEC-003 Tax calculation
  - name: Taxpayers
    description: SPEC-004 Identity validation
  - name: Series
    description: SPEC-005 Series and sequence numbers
  - name: Submissions
    description: SPEC-007 / SPEC-008 Submission to SUNAT or the OSE, daily summary and voiding
  - name: Inventory
    description: SPEC-010 Inventory
  - name: Migration
    description: SPEC-009 Legacy data migration
  - name: Catalogs
    description: SPEC-011 SUNAT catalogs
  - name: Public
    description: UC-24 Public document lookup (no authentication)
  - name: Reports
    description: UC-15 / UC-26 Sales reports

paths:
  /invoices:
    post:
      tags: [Invoices]
      operationId: issueInvoice
      summary: Issue an invoice or sales receipt
      description: |
        Use case `IssueInvoiceUseCase`. Validates (SPEC-004), calculates taxes (SPEC-003),
        assigns the sequence number (SPEC-005), builds and signs the XML (SPEC-006) and submits it (SPEC-007).
        If SUNAT or the OSE does not respond, it returns 202 with status `PENDING_SUBMISSION`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/invoice.schema.json#/$defs/IssueInvoiceRequest'
            examples:
              groceryInvoice:
                $ref: '#/components/examples/InvoiceRequest'
      responses:
        '201':
          description: Document issued with its CDR (ACCEPTED or OBSERVED).
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '../schemas/invoice.schema.json#/$defs/Invoice'
              examples:
                acceptedInvoice:
                  $ref: '#/components/examples/InvoiceResponse'
        '202':
          description: Document signed; submission pending (SUNAT or OSE unavailable).
          content:
            application/json:
              schema:
                $ref: '../schemas/invoice.schema.json#/$defs/Invoice'
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/SunatRejection' }
    get:
      tags: [Invoices]
      operationId: listInvoices
      summary: List and filter documents
      parameters:
        - { name: type, in: query, schema: { $ref: '../schemas/common.schema.json#/$defs/DocumentType' } }
        - { name: status, in: query, schema: { $ref: '../schemas/common.schema.json#/$defs/DocumentStatus' } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: customer, in: query, description: Customer document number, schema: { type: string } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Page of documents.
          content:
            application/json:
              schema:
                type: object
                required: [content, total]
                properties:
                  content:
                    type: array
                    items: { $ref: '../schemas/invoice.schema.json#/$defs/Invoice' }
                  total: { type: integer }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /invoices/{id}:
    get:
      tags: [Invoices]
      operationId: getInvoice
      summary: Get a document with its status and CDR
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Document.
          content:
            application/json:
              schema: { $ref: '../schemas/invoice.schema.json#/$defs/Invoice' }
        '404': { $ref: '#/components/responses/NotFound' }

  /invoices/{id}/xml:
    get:
      tags: [Invoices]
      operationId: downloadXml
      summary: Download the signed UBL 2.1 XML
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Signed XML (named RUC-TYPE-SERIES-NUMBER.xml).
          content:
            application/xml:
              schema: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }

  /invoices/{id}/cdr:
    get:
      tags: [Invoices]
      operationId: downloadCdr
      summary: Download the CDR (ZIP with the ApplicationResponse)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: CDR.
          content:
            application/zip:
              schema: { type: string, contentEncoding: base64 }
        '404': { $ref: '#/components/responses/NotFound' }

  /invoices/{id}/pdf:
    get:
      tags: [Invoices]
      operationId: downloadPdf
      summary: Printed representation (A4 or 80 mm ticket)
      parameters:
        - $ref: '#/components/parameters/Id'
        - { name: format, in: query, schema: { type: string, enum: [A4, TICKET], default: A4 } }
      responses:
        '200':
          description: PDF with QR code and hash.
          content:
            application/pdf:
              schema: { type: string, contentEncoding: base64 }
        '404': { $ref: '#/components/responses/NotFound' }

  /invoices/{id}/resubmissions:
    post:
      tags: [Submissions]
      operationId: resubmitInvoice
      summary: Resubmit a pending document or one with an exception
      description: Only for status `PENDING_SUBMISSION` or a CDR with result `EXCEPTION`. Never assigns a new sequence number.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Resubmission result.
          content:
            application/json:
              schema: { $ref: '../schemas/cdr-response.schema.json' }
        '409': { $ref: '#/components/responses/Conflict' }

  /notes:
    post:
      tags: [Notes]
      operationId: issueNote
      summary: Issue a credit note (07) or debit note (08)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../schemas/note.schema.json' }
            examples:
              itemReturn:
                $ref: '#/components/examples/CreditNoteRequest'
      responses:
        '201':
          description: Note issued.
          content:
            application/json:
              schema: { $ref: '../schemas/invoice.schema.json#/$defs/Invoice' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/SunatRejection' }

  /taxes/calculations:
    post:
      tags: [Taxes]
      operationId: calculateTaxes
      summary: Calculate taxes and totals without issuing (preview)
      description: Use case `CalculateTaxesUseCase`. No side effects; does not consume a sequence number.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                issueDate: { $ref: '../schemas/common.schema.json#/$defs/Date' }
                items:
                  type: array
                  minItems: 1
                  items: { $ref: '../schemas/line.schema.json#/$defs/LineRequest' }
                globalDiscount: { $ref: '../schemas/common.schema.json#/$defs/Amount' }
      responses:
        '200':
          description: Calculated lines and totals.
          content:
            application/json:
              schema:
                type: object
                required: [items, totals]
                properties:
                  items:
                    type: array
                    items: { $ref: '../schemas/line.schema.json#/$defs/CalculatedLine' }
                  totals: { $ref: '../schemas/invoice.schema.json#/$defs/Totals' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /taxpayers/{ruc}:
    get:
      tags: [Taxpayers]
      operationId: getTaxpayer
      summary: Validate a RUC and look it up in the RUC registry (status and condition)
      parameters:
        - name: ruc
          in: path
          required: true
          schema: { $ref: '../schemas/common.schema.json#/$defs/Ruc' }
      responses:
        '200':
          description: Taxpayer found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Taxpayer' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /identity-documents/validations:
    post:
      tags: [Taxpayers]
      operationId: validateIdentityDocument
      summary: Validate the format and check digit of a document (catalog 06)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documentType, documentNumber]
              properties:
                documentType: { $ref: '../schemas/common.schema.json#/$defs/IdentityDocumentType' }
                documentNumber: { type: string }
      responses:
        '200':
          description: Result.
          content:
            application/json:
              schema:
                type: object
                required: [valid]
                properties:
                  valid: { type: boolean }
                  reason: { type: string }
        '400': { $ref: '#/components/responses/ValidationError' }

  /series:
    get:
      tags: [Series]
      operationId: listSeries
      summary: List series and their last sequence number
      responses:
        '200':
          description: Series.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Series' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Series]
      operationId: createSeries
      summary: Register a series for a document type and establishment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Series' }
      responses:
        '201':
          description: Series created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Series' }
        '409': { $ref: '#/components/responses/Conflict' }

  /daily-summaries:
    post:
      tags: [Submissions]
      operationId: submitDailySummary
      summary: Build and submit the daily summary (RC) of the sales receipts of a date
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [referenceDate]
              properties:
                referenceDate: { $ref: '../schemas/common.schema.json#/$defs/Date' }
      responses:
        '202':
          description: Submitted; SUNAT returns a ticket for asynchronous lookup.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }

  /voided-documents:
    post:
      tags: [Submissions]
      operationId: submitVoidedDocuments
      summary: Submit a voiding communication (RA) for documents
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../schemas/voided-documents.schema.json' }
      responses:
        '202':
          description: Submitted; ticket for asynchronous lookup.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /tickets/{ticket}:
    get:
      tags: [Submissions]
      operationId: getTicket
      summary: Get the status of an asynchronous submission (summary or voiding)
      parameters:
        - { name: ticket, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Ticket status.
          content:
            application/json:
              schema: { $ref: '../schemas/cdr-response.schema.json' }
        '404': { $ref: '#/components/responses/NotFound' }

  /products:
    get:
      tags: [Inventory]
      operationId: listProducts
      summary: List products with their tax configuration
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Products.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '../schemas/product.schema.json' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Inventory]
      operationId: createProduct
      summary: Register a product
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../schemas/product.schema.json' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '../schemas/product.schema.json' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /inventory/movements:
    get:
      tags: [Inventory]
      operationId: listMovements
      summary: Stock ledger (includes movements migrated from the legacy system)
      parameters:
        - { name: product, in: query, schema: { type: string } }
        - { name: origin, in: query, schema: { type: string, enum: [NEW, LEGACY] } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: Movements.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '../schemas/inventory-movement.schema.json' }
        '400': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Inventory]
      operationId: recordMovement
      summary: Record an inbound movement, a manual outbound movement or an adjustment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../schemas/inventory-movement.schema.json' }
      responses:
        '201':
          description: Recorded.
        '400': { $ref: '#/components/responses/ValidationError' }

  /migrations:
    post:
      tags: [Migration]
      operationId: startMigration
      summary: Load a batch from the legacy system (CSV or JSON)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, contentMediaType: text/csv }
                dryRun:
                  type: boolean
                  default: true
                  description: true = only validate and report, without persisting.
      responses:
        '202':
          description: Batch accepted for processing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MigrationBatch' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /migrations/{batch}:
    get:
      tags: [Migration]
      operationId: getMigrationBatch
      summary: Batch status and reconciliation
      parameters:
        - { name: batch, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Batch.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MigrationBatch' }
        '404': { $ref: '#/components/responses/NotFound' }

  /migrations/{batch}/issues:
    get:
      tags: [Migration]
      operationId: listMigrationIssues
      summary: Quarantined rows with their reason
      parameters:
        - { name: batch, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Issues.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [sourceRow, rule, message]
                  properties:
                    sourceRow: { type: integer }
                    rule: { type: string, examples: [SPEC-009/M-03] }
                    message: { type: string }
                    originalData: { $ref: '../schemas/legacy-movement.schema.json' }
        '404': { $ref: '#/components/responses/NotFound' }

  /public/invoices:
    get:
      tags: [Public]
      operationId: lookupPublicInvoice
      summary: Public document lookup by the customer (UC-24)
      description: |
        No authentication. Requires the data printed on the document (including the total amount)
        so that other people's documents cannot be enumerated. Rate-limited per IP.
      security: []
      parameters:
        - { name: ruc, in: query, required: true, schema: { $ref: '../schemas/common.schema.json#/$defs/Ruc' } }
        - { name: type, in: query, required: true, schema: { $ref: '../schemas/common.schema.json#/$defs/DocumentType' } }
        - { name: number, in: query, required: true, schema: { $ref: '../schemas/common.schema.json#/$defs/DocumentNumber' } }
        - { name: issueDate, in: query, required: true, schema: { type: string, format: date } }
        - { name: payableAmount, in: query, required: true, schema: { $ref: '../schemas/common.schema.json#/$defs/Amount' } }
      responses:
        '200':
          description: Document found; includes the SUNAT status and download links (XML, CDR, PDF).
          content:
            application/json:
              schema:
                type: object
                required: [number, issueDate, payableAmount, status, links]
                properties:
                  number: { $ref: '../schemas/common.schema.json#/$defs/DocumentNumber' }
                  issueDate: { type: string, format: date }
                  payableAmount: { $ref: '../schemas/common.schema.json#/$defs/Amount' }
                  status: { $ref: '../schemas/common.schema.json#/$defs/DocumentStatus' }
                  links:
                    type: object
                    properties:
                      xml: { type: string, format: uri-reference }
                      cdr: { type: string, format: uri-reference }
                      pdf: { type: string, format: uri-reference }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429':
          description: Too many lookups from the same IP.

  /reports/invoices:
    get:
      tags: [Reports]
      operationId: exportInvoiceReport
      summary: Export a document report to Excel (UC-15, UC-26)
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: detail, in: query, description: One row per document or per line item, schema: { type: string, enum: [DOCUMENTS, ITEMS], default: DOCUMENTS } }
        - { name: establishment, in: query, description: Establishment code; omitted = all establishments, schema: { type: string, pattern: '^[0-9]{4}$' } }
      responses:
        '200':
          description: Excel file with the documents issued, accepted, rejected and voided in the period.
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, contentEncoding: base64 }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /catalogs/{number}:
    get:
      tags: [Catalogs]
      operationId: getCatalog
      summary: Get a SUNAT catalog
      parameters:
        - { name: number, in: path, required: true, schema: { type: string, enum: ['01', '02', '03', '05', '06', '07', '08', '09', '10', '16', '51'] } }
      responses:
        '200':
          description: Catalog.
          content:
            application/json:
              schema: { $ref: '../schemas/catalog.schema.json' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated UUID; the same value returns the same document without consuming another sequence number.
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
  schemas:
    Taxpayer:
      type: object
      required: [ruc, legalName, status, condition]
      properties:
        ruc: { $ref: '../schemas/common.schema.json#/$defs/Ruc' }
        legalName: { type: string }
        status: { type: string, description: SUNAT taxpayer status, examples: [ACTIVO, BAJA DE OFICIO, SUSPENSION TEMPORAL] }
        condition: { type: string, description: SUNAT address condition, examples: [HABIDO, NO HABIDO] }
        address: { type: string }
        ubigeo: { type: string }
        checkedAt: { type: string, format: date-time }
        source: { type: string, enum: [LOCAL_REGISTRY, EXTERNAL_SERVICE] }
    Series:
      type: object
      required: [documentType, series, establishment]
      properties:
        documentType: { $ref: '../schemas/common.schema.json#/$defs/DocumentType' }
        series: { $ref: '../schemas/common.schema.json#/$defs/Series' }
        establishment: { type: string, pattern: '^[0-9]{4}$' }
        lastSequenceNumber: { type: integer, minimum: 0, readOnly: true }
        active: { type: boolean, default: true }
    Ticket:
      type: object
      required: [ticket, identifier]
      properties:
        ticket: { type: string }
        identifier: { type: string, examples: [RC-20261022-1, RA-20261022-1] }
    MigrationBatch:
      type: object
      required: [batch, status, dryRun]
      properties:
        batch: { type: string, examples: [MIG-2026-10-001] }
        status: { type: string, enum: [RECEIVED, PROCESSING, COMPLETED, COMPLETED_WITH_ISSUES, FAILED] }
        dryRun: { type: boolean }
        rowsRead: { type: integer }
        rowsMigrated: { type: integer }
        rowsQuarantined: { type: integer }
        reconciliation:
          type: object
          description: Control totals source vs target (must match).
          properties:
            sourceInboundTotal: { type: string }
            targetInboundTotal: { type: string }
            sourceOutboundTotal: { type: string }
            targetOutboundTotal: { type: string }
  responses:
    Unauthorized:
      description: Missing or expired token, or missing required role.
      content:
        application/problem+json:
          schema: { $ref: '../schemas/error.schema.json' }
    ValidationError:
      description: Request or business rule validation error.
      content:
        application/problem+json:
          schema: { $ref: '../schemas/error.schema.json' }
    Conflict:
      description: State conflict (duplicate series, document already submitted, etc.).
      content:
        application/problem+json:
          schema: { $ref: '../schemas/error.schema.json' }
    NotFound:
      description: Resource not found.
      content:
        application/problem+json:
          schema: { $ref: '../schemas/error.schema.json' }
    SunatRejection:
      description: SUNAT or the OSE rejected the document (codes 2000-3999). The sequence number stays consumed.
      content:
        application/problem+json:
          schema: { $ref: '../schemas/error.schema.json' }
  examples:
    InvoiceRequest:
      summary: Grocery invoice with ISC (catalog 08) and ICBPER
      externalValue: ../schemas/examples/invoice-request.json
    InvoiceResponse:
      summary: Accepted invoice
      externalValue: ../schemas/examples/invoice-response.json
    CreditNoteRequest:
      summary: Credit note for a line-item return
      externalValue: ../schemas/examples/credit-note-request.json
