[project]
name = "abc-invoicing"
version = "0.1.0"
description = "UBL 2.1 invoice XML generation with the SUNAT (Peru) customization."
requires-python = ">=3.10"
dependencies = ["xsdata==24.11", "lxml==5.3.0", "signxml==5.3.0", "cryptography==50.0.2"]

[project.optional-dependencies]
dev = ["pytest==8.3.3", "xsdata[cli]==24.11"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
abc_invoicing = ["web/static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
